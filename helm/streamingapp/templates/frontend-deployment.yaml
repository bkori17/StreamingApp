apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend

spec:

  replicas: {{ .Values.services.frontend.replicas }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:

      containers:

        - name: frontend

          image: "{{ .Values.services.frontend.image }}:{{ .Values.services.frontend.tag }}"

          ports:

            - containerPort: {{ .Values.services.frontend.port }}
