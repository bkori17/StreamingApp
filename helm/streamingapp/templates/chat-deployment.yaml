apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat

spec:

  replicas: {{ .Values.services.chat.replicas }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: chat

  template:
    metadata:
      labels:
        app: chat

    spec:
      containers:

        - name: chat

          image: "{{ .Values.services.chat.image }}:{{ .Values.services.chat.tag }}"

          ports:
            - containerPort: {{ .Values.services.chat.port }}

          env:

            - name: PORT
              value: {{ .Values.services.chat.port | quote }}

          envFrom:

            - configMapRef:
                name: streamingapp-config

            - secretRef:
                name: streamingapp-secret
