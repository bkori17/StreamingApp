apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:

  replicas: {{ .Values.services.auth.replicas }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: auth

  template:
    metadata:
      labels:
        app: auth

    spec:
      containers:

        - name: auth

          image: "{{ .Values.services.auth.image }}:{{ .Values.services.auth.tag }}"

          ports:
            - containerPort: {{ .Values.services.auth.port }}

          env:

            - name: PORT
              value: {{ .Values.services.auth.port | quote }}

          envFrom:

            - configMapRef:
                name: streamingapp-config

            - secretRef:
                name: streamingapp-secret
